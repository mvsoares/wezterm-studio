[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wezterm-theme"
version = "1.4.0"
description = "Cross-platform interactive Tab Bar Theme Picker (62 themes), Symbol Customizer, and Live Font & Appearance Studio for WezTerm."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Marcus Vinícius Soares" },
]
keywords = [
    "wezterm",
    "terminal",
    "theme",
    "tabs",
    "fonts",
    "nerd-fonts",
    "tui",
    "customizer",
    "powerline",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mvsoares/wezterm-studio"
Repository = "https://github.com/mvsoares/wezterm-studio"
Issues = "https://github.com/mvsoares/wezterm-studio/issues"

[project.scripts]
wezterm-theme = "wezterm_theme.cli:main"
wezterm-tab-theme = "wezterm_theme.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wezterm_theme = ["assets/*.html"]
