name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-attach:
    name: Build Wheel & Source Dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build & twine
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate package metadata & PyPI README rendering
        run: twine check --strict dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Attach wheel & tarball to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

  publish-pypi:
    name: Publish to PyPI (Trusted Publisher)
    needs: build-and-attach
    if: github.event_name == 'workflow_dispatch' || vars.PYPI_TRUSTED_PUBLISHER == 'enabled'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wezterm-theme
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
